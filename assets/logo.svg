<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="maltGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9AD72" />
      <stop offset="100%" stop-color="#F5E5C9" />
    </linearGradient>
    <linearGradient id="cocoaFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B2419" />
      <stop offset="100%" stop-color="#7B482C" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Monitor Outer Body -->
  <rect x="25" y="25" width="190" height="135" rx="18" fill="url(#cocoaFrame)" stroke="#D9AD72" stroke-width="3" />
  
  <!-- Monitor Bezel Inner Highlight -->
  <rect x="33" y="33" width="174" height="119" rx="12" fill="#25160E" />

  <!-- Monitor Screen Display Area -->
  <rect x="38" y="38" width="164" height="109" rx="8" fill="#1C100A" />

  <!-- Screen Grid / Scanlines Pattern -->
  <line x1="38" y1="65" x2="202" y2="65" stroke="#7B482C" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.4" />
  <line x1="38" y1="92" x2="202" y2="92" stroke="#7B482C" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.4" />
  <line x1="38" y1="120" x2="202" y2="120" stroke="#7B482C" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.4" />

  <!-- Neural Network Nodes & Memory Cache Channels inside screen -->
  <!-- Connection lines -->
  <path d="M68 92 L100 64 L140 64 L172 92 L140 120 L100 120 Z" stroke="#D9AD72" stroke-width="2" stroke-linejoin="round" opacity="0.8" />
  <line x1="100" y1="64" x2="140" y2="120" stroke="#D9AD72" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6" />
  <line x1="140" y1="64" x2="100" y2="120" stroke="#D9AD72" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6" />
  <line x1="68" y1="92" x2="172" y2="92" stroke="#F5E5C9" stroke-width="2" opacity="0.85" />

  <!-- Center Core Cache Hub -->
  <circle cx="120" cy="92" r="10" fill="url(#maltGlow)" filter="url(#softGlow)" />
  <circle cx="120" cy="92" r="5" fill="#3B2419" />

  <!-- Peripheral Nodes -->
  <circle cx="68" cy="92" r="6" fill="#F5E5C9" stroke="#7B482C" stroke-width="2" />
  <circle cx="100" cy="64" r="5" fill="#D9AD72" />
  <circle cx="140" cy="64" r="5" fill="#D9AD72" />
  <circle cx="172" cy="92" r="6" fill="#F5E5C9" stroke="#7B482C" stroke-width="2" />
  <circle cx="140" cy="120" r="5" fill="#D9AD72" />
  <circle cx="100" cy="120" r="5" fill="#D9AD72" />

  <!-- Data Packet Pulses -->
  <circle cx="84" cy="92" r="2.5" fill="#FFF8ED" />
  <circle cx="156" cy="92" r="2.5" fill="#FFF8ED" />

  <!-- Monitor Stand Neck -->
  <path d="M106 160 L98 194 L142 194 L134 160 Z" fill="#7B482C" stroke="#3B2419" stroke-width="2" />

  <!-- Monitor Base Plate -->
  <rect x="75" y="194" width="90" height="14" rx="7" fill="url(#cocoaFrame)" stroke="#D9AD72" stroke-width="2" />
  <line x1="90" y1="201" x2="150" y2="201" stroke="#D9AD72" stroke-width="2" stroke-linecap="round" opacity="0.7" />
</svg>
